[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["alphazx"]
[project]
name = "AlphaZX"
version = "0.0.1"
authors = [
    { name = "Joseph Denman", email = "josephrileydenman@gmail.com" },
]
description = "A package for creating and manipulating ZX-calculus diagrams"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
[project.urls]
Homepage = "https://github.com/JosephDenman/AlphaZX.git"
[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]